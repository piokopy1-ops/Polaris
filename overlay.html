<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Polaris Alert — OBS Overlay</title><style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent!important;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.stage{position:fixed;inset:0;pointer-events:none}.alert{--accent:#d4a744;position:absolute;right:42px;top:42px;width:min(440px,calc(100vw - 84px));display:grid;grid-template-columns:54px 1fr;gap:14px;align-items:center;padding:15px 18px;background:linear-gradient(135deg,rgba(12,15,12,.96),rgba(28,31,24,.94));color:#eee9dd;border:1px solid rgba(224,189,101,.5);border-left:5px solid var(--accent);border-radius:12px;box-shadow:0 18px 50px #000b;opacity:0;transform:translateX(35px);transition:opacity .28s ease,transform .34s cubic-bezier(.2,.8,.2,1)}.alert.on{opacity:1;transform:none}.icon{width:52px;height:52px;display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--accent) 18%,#111);border:1px solid var(--accent);color:var(--accent);font-size:25px;font-weight:900}.eyebrow{color:var(--accent);font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.headline{font:800 20px/1.18 Georgia,serif;margin:3px 0}.message{color:#bbbeb5;font-size:14px;line-height:1.35}.bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:100%;transform-origin:left}.alert.on .bar.timed{animation:countdown var(--duration) linear forwards}@keyframes countdown{to{transform:scaleX(0)}}
</style></head><body><div class="stage"><section id="alert" class="alert" role="alert" aria-live="assertive"><div id="icon" class="icon">⚠</div><div><div id="eyebrow" class="eyebrow">POLARIS ALERT</div><div id="headline" class="headline"></div><div id="message" class="message"></div></div><div id="bar" class="bar"></div></section></div><script>
const CHANNEL='polaris-alert-v1',CONTROL=CHANNEL+'-control',STATUS=CHANNEL+'-status',el=document.getElementById('alert'),bar=document.getElementById('bar'),channel='BroadcastChannel'in window?new BroadcastChannel(CHANNEL):null;let timer;const types={missable:{icon:'⚠',label:'MISSABLE',color:'#d45f62'},choice:{icon:'◆',label:'WAŻNY WYBÓR',color:'#d4a744'},collectible:{icon:'✦',label:'W POBLIŻU',color:'#77b47c'},save:{icon:'▣',label:'ZAPIS GRY',color:'#68a9d4'},tip:{icon:'i',label:'POLARIS',color:'#c99b3e'}};
function sound(){const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext)return;const ctx=new AudioContext(),gain=ctx.createGain(),osc=ctx.createOscillator();osc.frequency.setValueAtTime(660,ctx.currentTime);osc.frequency.setValueAtTime(880,ctx.currentTime+.12);gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.02);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.38);osc.connect(gain).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.4)}
function receive(data){if(!data||data.action==='hide'){clearTimeout(timer);el.classList.remove('on');return}const t=types[data.type]||types.tip;document.getElementById('icon').textContent=t.icon;document.getElementById('eyebrow').textContent=t.label;document.getElementById('headline').textContent=data.headline||'Polaris Alert';document.getElementById('message').textContent=data.message||'';el.style.setProperty('--accent',t.color);bar.className='bar';void bar.offsetWidth;el.classList.add('on');sound();clearTimeout(timer);if(data.duration>0){bar.style.setProperty('--duration',data.duration+'ms');bar.classList.add('timed');timer=setTimeout(()=>el.classList.remove('on'),data.duration)}}
function announce(){const data={action:'overlay-ready',at:Date.now()};localStorage.setItem(STATUS,JSON.stringify(data));if(channel)channel.postMessage(data)}
function route(data){if(!data)return;if(data.action==='panel-ping')return announce();receive(data)}
if(channel)channel.onmessage=e=>route(e.data);window.addEventListener('storage',e=>{if(e.key===CHANNEL||e.key===CONTROL)try{route(JSON.parse(e.newValue))}catch{}});announce();setInterval(announce,2000);
const hotkeyAlerts={missable:{type:'missable',headline:'Uwaga — możesz to pominąć',message:'Zrób ręczny zapis przed kontynuowaniem.',duration:8000},save:{type:'save',headline:'Zrób zapis gry',message:'Warto utworzyć ręczny zapis w tym miejscu.',duration:8000},choice:{type:'choice',headline:'Ważny wybór',message:'Ta decyzja może wpłynąć na dalszy postęp.',duration:8000},collectible:{type:'collectible',headline:'Coś jest w pobliżu',message:'Sprawdź okolicę przed przejściem dalej.',duration:8000}};const hotkey=new URLSearchParams(location.search).get('hotkey');if(hotkey==='hide')receive({action:'hide'});else if(hotkeyAlerts[hotkey])setTimeout(()=>receive({action:'show',...hotkeyAlerts[hotkey],id:Date.now()}),400);
</script></body></html>
